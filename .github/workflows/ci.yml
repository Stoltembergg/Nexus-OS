name: Nexus OS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: Build, Lint and Test (Multi-Platform)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format Check
        run: cargo fmt --all -- --check

      - name: Cargo Check
        run: cargo check --workspace --all-targets

      - name: Clippy Linting
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Unit & Integration Tests
        run: cargo test --workspace --verbose

      - name: Run Phase 0 PoC Loader
        run: cargo run -p nexus-poc

      - name: Build Bare-Metal UEFI Bootloader & Kernel
        run: cargo build -p nexus-boot --target x86_64-unknown-uefi

      - name: Install QEMU and OVMF (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf

      - name: Run Phase 3 Bare-Metal UEFI Boot Test (Ubuntu)
        if: runner.os == 'Linux'
        run: bash scripts/test-boot.sh
